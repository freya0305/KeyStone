# ==============================================================================
# KeyStone Docker Compose - Local Development
# ==============================================================================
# Usage:
#   1. cp .env.example .env  # Configure your environment variables
#   2. docker compose up -d  # Start all services
#   3. docker compose logs -f api  # View API logs
#   4. Visit http://localhost:3000
#
# For local S3 development (resume uploads):
#   - LocalStack is included and configured automatically
#   - Bucket "keystone-resumes-dev" is created on startup
#   - Use AWS_ACCESS_KEY_ID=test and AWS_SECRET_ACCESS_KEY=test
#
# For production:
#   - Remove localstack service
#   - Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to real AWS credentials
#   - Set S3_BUCKET to your production bucket name
# ==============================================================================

services:
  # ---- Backend API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keystone_api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://keystone:${POSTGRES_PASSWORD:-keystone}@db:5432/keystone
      - REDIS_URL=redis://cache:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      # AWS S3 Configuration
      # For local development: uses LocalStack (test credentials)
      # For production: set real AWS credentials in .env
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-} # Set to http://localstack:4566 for local
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - S3_BUCKET=${S3_BUCKET:-keystone-resumes-dev}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    command: /app/startup/entrypoint.sh uvicorn keystone.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- Frontend Web (Next.js) ----
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
    container_name: keystone_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: keystone_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone}
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ---- Redis Cache ----
  cache:
    image: redis:7-alpine
    container_name: keystone_cache
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- LocalStack (Local S3 Emulator) ----
  # Remove this service in production and configure real AWS S3
  localstack:
    image: localstack/localstack:3.0
    container_name: keystone_localstack
    ports:
      - "4566:4566" # LocalStack S3 endpoint
    environment:
      - SERVICES=s3
      - LOCALSTACK_HOST=localstack
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Celery Worker (Background Tasks) ----
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keystone_worker
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://keystone:${POSTGRES_PASSWORD:-keystone}@db:5432/keystone
      - REDIS_URL=redis://cache:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      # AWS S3 Configuration (same as API)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - S3_BUCKET=${S3_BUCKET:-keystone-resumes-dev}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    command: /app/startup/entrypoint.sh celery -A keystone.workers.celery_app worker --loglevel=info --beat
    healthcheck:
      test: ["CMD-SHELL", "exit 0"] # Celery doesn't have a simple health check
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ==============================================================================
# Volumes - Persist data across container restarts
# ==============================================================================
volumes:
  postgres_data: # PostgreSQL data directory
  redis_data: # Redis persistence (AOF)
  localstack_data: # LocalStack S3 data

# ==============================================================================
# Networks - Service communication
# ==============================================================================
networks:
  default:
    name: keystone_network
    driver: bridge
