[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone"
version = "0.1.0"
description = "AI-powered dual-sided product: Job Seeker resume optimization + Recruiter JD generation"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # Redis
    "redis>=5.0.0",
    # AI
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    # Browser automation (LinkedIn JD fetching)
    "playwright>=1.40.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    # Payments
    "stripe>=8.0.0",
    # Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # File processing
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    # AWS
    "boto3>=1.34.0",
    # Observability
    "structlog>=23.1.0",
    "sentry-sdk>=2.0.0",
    # Utils
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    # Celery
    "celery>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "black>=23.0",
    "pre-commit>=4.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
